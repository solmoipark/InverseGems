default_age_tolerance: 1.0e-9

# Optional per-model reaction provenance for parameter-version-aware selection:
# reaction_model_id: trial_parameters_v0
# reaction_model_signature: <sha256 signature from surrogate_model_manifest.json>
# The compiler matches material_system + age_days first, then narrows by these
# fields when the query or CLI requests a specific reaction model.

models:
  - id: OPC_only_age28_current_pilot
    material_system: OPC_only
    age_days: 28.0
    reaction_model_id: local_default_parameters
    reaction_model_signature: 7b5ffe7839e76f81aa94e4d387d67ebfb1b993e8483906adfce3c239553eb9b1
    model_table: data/model_table_OPC_only_age28_current_scale1000_retry_stable_targets.csv
    model_bundle: reports/baseline_surrogate_OPC_only_age28_current_scale1000_retry/model.joblib
    notes: OPC-only age-28 model calculated from 1000 recipes using the current reaction parameter set and adaptive xGEMS-water retry; 1000 complete xGEMS runs were used for training, including 7 rescued at cap_w_b=0.45.

