name: OPC_fly_ash_age28_balanced

model_table: data/model_table_OPC_fly_ash_age28_500_stable_targets.csv
model_bundle: reports/baseline_surrogate_OPC_fly_ash_age28_500/model.joblib

constraints:
  metadata:
    material_system:
      include: [OPC_fly_ash]
    age_bin:
      include: [standard]
  inputs:
    OPC: {min: 25, max: 85}
    fly_ash: {min: 15, max: 70}
    gypsum: {min: 0, max: 8}
    w_b: {min: 0.30, max: 0.55}
    age_days: {min: 28, max: 28}
  predicted_targets:
    porosity: {min: 0.20, max: 0.45}
    pH: {min: 10.5, max: 13.5}
    C-A-S-H: {min: 0.035}
    Portlandite: {max: 0.018}

objectives:
  minimize:
    OPC: 0.25
    porosity: 1.00
    Portlandite: 0.50
    gypsum: 0.10
  maximize:
    C-A-S-H: 1.00
    ettringite: 0.10

score:
  normalize: minmax

top_k: 50
