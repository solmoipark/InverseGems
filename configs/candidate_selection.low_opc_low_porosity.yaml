top_k: 10

constraints:
  chemistry_status: complete

  inputs:
    OPC:
      max: 35.0
    w_b:
      min: 0.30
      max: 0.40

  validated_targets:
    porosity:
      max: 0.27
    C-A-S-H:
      min: 0.035
    Portlandite:
      max: 0.001

  prediction_errors:
    porosity:
      max_abs: 0.01

objectives:
  minimize:
    validated_targets:
      porosity: 1.2
      Portlandite: 0.2
      Calcite: 0.2
    inputs:
      OPC: 1.0

  maximize:
    validated_targets:
      C-A-S-H: 0.6
      ettringite: 0.3

score:
  normalize: minmax
