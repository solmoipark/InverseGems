top_k: 10

pH_uncertainty_policy:
  mode: auto
  apply_when_pH_used: true
  penalty: 1000000.0

constraints:
  chemistry_status: complete

  inputs:
    OPC:
      max: 55.0
    w_b:
      min: 0.30
      max: 0.40

  validated_targets:
    porosity:
      max: 0.29
    C-A-S-H:
      min: 0.052
    Portlandite:
      max: 0.0001

  prediction_errors:
    porosity:
      max_abs: 0.01
    C-A-S-H:
      max_abs: 0.0025

objectives:
  minimize:
    validated_targets:
      porosity: 1.0
      Portlandite: 0.5
      Calcite: 0.2
    inputs:
      OPC: 0.4
    prediction_errors:
      porosity: 0.2

  maximize:
    validated_targets:
      C-A-S-H: 1.0
      ettringite: 0.2

score:
  normalize: minmax
