name: OPC_fly_ash_age28_ettringite_cap_no_porosity

model_table: data/model_table_OPC_fly_ash_age28_500_stable_targets.csv
model_bundle: reports/baseline_surrogate_OPC_fly_ash_age28_500/model.joblib

constraints:
  metadata:
    material_system:
      include: [OPC_fly_ash]
    age_bin:
      include: [standard]
  inputs:
    OPC: {min: 25, max: 85}
    fly_ash: {min: 15, max: 70}
    gypsum: {min: 0, max: 8}
    w_b: {min: 0.30, max: 0.55}
    age_days: {min: 28, max: 28}
  predicted_targets:
    C-A-S-H: {min: 0.035}
    ettringite: {max: 0.012}
    Portlandite: {max: 0.018}

objectives:
  minimize:
    OPC: 0.30
    Portlandite: 0.60
    gypsum: 0.30
  maximize:
    C-A-S-H: 1.00

score:
  normalize: minmax

top_k: 50
