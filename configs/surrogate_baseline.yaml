model:
  kind: ExtraTreesRegressor
  n_estimators: 300
  random_state: 42
  n_jobs: -1
  min_samples_leaf: 2
  max_features: 1.0

split:
  strategy: group_shuffle
  group_column: meta__recipe_id
  group_regex: "^(.*)_age_[0-9p.]+$"
  test_size: 0.2
  random_state: 42
  sparse_target_support:
    enabled: true
    candidate_splits: 200
    sparse_target_fraction_threshold: 0.05
    min_test_nonzero_count: 10

evaluation:
  nonzero_threshold: 1.0e-12
  sparse_target_fraction_threshold: 0.05
  min_test_nonzero_count: 10
  save_predictions: true
  permutation_importance:
    enabled: true
    n_repeats: 5
    random_state: 42
    max_test_rows: 10000
