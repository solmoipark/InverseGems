      min: 25.0
      max: 85.0
    fly_ash:
      min: 15.0
      max: 70.0
    gypsum:
      min: 0.0
      max: 8.0
    w_b:
      min: 0.30
      max: 0.55
    age_days:
      equals: 28.0

  validated_targets:
    C-A-S-H:
      min: 0.035
    ettringite:
      max: 0.012
    Portlandite:
