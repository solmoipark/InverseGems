name: LC3_like_age28_ettringite_cap_no_porosity

model_table: data/model_table_LC3_like_age28_500_stable_targets.csv
model_bundle: reports/baseline_surrogate_LC3_like_age28_500/model.joblib

constraints:
  metadata:
    material_system:
      include: [LC3_like]
    age_bin:
      include: [standard]
  inputs:
    OPC: {min: 35, max: 65}
    metakaolin: {min: 15, max: 40}
    limestone: {min: 5, max: 25}
    gypsum: {min: 0, max: 8}
    w_b: {min: 0.30, max: 0.55}
    age_days: {min: 28, max: 28}
  predicted_targets:
    C-A-S-H: {min: 0.035}
    ettringite: {max: 0.012}

objectives:
  minimize:
    OPC: 0.30
    ettringite: 0.60
    gypsum: 0.30
  maximize:
    C-A-S-H: 1.00
    monocarbonate: 0.20

score:
  normalize: minmax

top_k: 50
