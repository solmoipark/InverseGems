[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-gems"
version = "0.2.0"
description = "Forward thermodynamic modeling scaffolding for blended cementitious binders with xGEMS/GEMS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pydantic",
  "pyyaml",
  "scikit-learn",
  "matplotlib",
  "typer",
]

[project.optional-dependencies]
test = ["pytest"]
llm = ["openai"]

[project.scripts]
inverse-gems = "inverse_gems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
